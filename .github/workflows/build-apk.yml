name: Build LoveLink APKs

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Both Girl & Boy APKs
        run: |
          gradle assembleGirlDebug assembleBoyDebug --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/girl/debug -name "*.apk" -exec cp {} release-apks/MyBoy.apk \;
          find app/build/outputs/apk/boy/debug -name "*.apk" -exec cp {} release-apks/MyGirl.apk \;
          ls -la release-apks/

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyBoy-and-MyGirl-APKs
          path: release-apks/*.apk

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.6.0
          name: "My Boy 💕 & My Girl 💙 v1.6.0 (Fix Layar Pas & Theme Inject)"
          body: |
            ## 📱 Pembaruan v1.6.0: Perbaikan Total Skala Layar & Auto-Fit!
            
            Pembaruan v1.6.0:
            * 🎯 **Tampilan 100% Pas di Layar HP:** Menggunakan viewport dan InitialScale dinamis berbasis resolusi layar HP, sehingga kotak QR dan nomor telepon TIDAK terpotong lagi ke kanan.
            * 🎨 **Injeksi Tema CSP-Safe:** Menggunakan TextNode langsung agar tema warna (Pink Pastel / Dark Blue) tembus proteksi WhatsApp Web.
            * 🚫 **Banner Desktop Dihilangkan:** Kotak 'Unduh WhatsApp untuk Windows' otomatis disembunyikan.
            * 💬 **Chat 1-Kolom Fullscreen:** Begitu akun tertaut, obrolan tampil 1-kolom penuh layaknya WA asli.
            
            ### Unduh File APK:
            * **[MyBoy.apk](MyBoy.apk)**: Untuk cewekmu (Nama: **My Boy 💕**, Ikon: Foto kamu, Tema Pink Pastel).
            * **[MyGirl.apk](MyGirl.apk)**: Untuk kamu (Nama: **My Girl 💙**, Ikon: Foto cewekmu, Tema Dark Blue).
            
            ### Cara Pakai Tanpa Scan QR:
            1. Buka aplikasi di HP cewekmu.
            2. Klik **"Tautkan dengan nomor telepon"** & masukkan nomor WA kamu.
            3. Muncul kode 8 digit $\rightarrow$ buka WA utama $\rightarrow$ Perangkat Tertaut $\rightarrow$ Masukkan kode tersebut.
            4. Selesai!
          files: |
            release-apks/MyBoy.apk
            release-apks/MyGirl.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
