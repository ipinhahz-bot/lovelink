name: Build LoveLink APKs

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Both Girl & Boy APKs
        run: |
          gradle assembleGirlDebug assembleBoyDebug --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/girl/debug -name "*.apk" -exec cp {} release-apks/MyBoy.apk \;
          find app/build/outputs/apk/boy/debug -name "*.apk" -exec cp {} release-apks/MyGirl.apk \;
          ls -la release-apks/

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyBoy-and-MyGirl-APKs
          path: release-apks/*.apk

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.8.0
          name: "My Boy 💕 & My Girl 💙 v1.8.0 (Versi Stabil & Sinkronisasi Lancar)"
          body: |
            ## 📱 Pembaruan v1.8.0: Rombak Total Arsitektur Bersih & Stabil!
            
            Pembaruan v1.8.0:
            * 🚀 **Sinkronisasi Pesan 100% Lancar:** Menghapus seluruh loop agresif di background yang sebelumnya membekukan proses download pesan WhatsApp.
            * 🛠️ **Tata Letak Alami & Utuh:** Tidak ada lagi layar putih kosong saat akun terhubung. Chat list dan ruang pesan muncul alami dan stabil.
            * 🔍 **Pinch-to-Zoom & Overview Alami:** Bisa di-zoom manual sesuai kenyamanan tanpa takut elemen terpotong.
            * 🎨 **Tema Lucu Non-Destruktif:** Pink Pastel (My Boy) & Dark Blue (My Girl) tetap aktif tanpa merusak fungsionalitas WhatsApp.
            
            ### Unduh File APK:
            * **[MyBoy.apk](MyBoy.apk)**: Untuk cewekmu (Nama: **My Boy 💕**, Ikon: Foto kamu, Tema Pink Pastel).
            * **[MyGirl.apk](MyGirl.apk)**: Untuk kamu (Nama: **My Girl 💙**, Ikon: Foto cewekmu, Tema Dark Blue).
            
            ### Cara Pakai Tanpa Scan QR:
            1. Buka aplikasi di HP cewekmu.
            2. Klik **"Tautkan dengan nomor telepon"** & masukkan nomor WA kamu.
            3. Muncul kode 8 digit $\rightarrow$ buka WA utama $\rightarrow$ Perangkat Tertaut $\rightarrow$ Masukkan kode tersebut.
            4. Selesai!
          files: |
            release-apks/MyBoy.apk
            release-apks/MyGirl.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
