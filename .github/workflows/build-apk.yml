name: Build LoveLink APKs

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Both Girl & Boy APKs
        run: |
          gradle assembleGirlDebug assembleBoyDebug --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/girl/debug -name "*.apk" -exec cp {} release-apks/MyBoy.apk \;
          find app/build/outputs/apk/boy/debug -name "*.apk" -exec cp {} release-apks/MyGirl.apk \;
          ls -la release-apks/

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyBoy-and-MyGirl-APKs
          path: release-apks/*.apk

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.3.0
          name: "My Boy 💕 & My Girl 💙 v1.3.0 (Layar Pas HP)"
          body: |
            ## 📱 Tampilan 100% Seperti WhatsApp Asli (Bukan Web)!
            
            Pembaruan v1.2.0:
            * ✅ **Tata Letak 1-Kolom Full Screen:** Daftar chat selebar layar HP tanpa pembagian kolom desktop kaku.
            * ✅ **Buka Chat Responsif:** Klik kontak langsung membuka ruang obrolan penuh dengan animasi slide mulus.
            * ✅ **Tombol Kembali (Back):** Tombol panah kembali di dalam chat + tombol 'Back' bawaan HP otomatis kembali ke daftar chat.
            * ✅ **Tema Lucu & Foto Tetap Aktif:** Pink Pastel + Animasi Cinta (My Boy) & Dark Blue (My Girl).
            
            ### Unduh File APK:
            * **[MyBoy.apk](MyBoy.apk)**: Khusus dipasang di HP cewekmu (Nama: **My Boy 💕**, Ikon: Foto kamu).
            * **[MyGirl.apk](MyGirl.apk)**: Khusus dipasang di HP kamu (Nama: **My Girl 💙**, Ikon: Foto cewekmu).
            
            ### Cara Pakai Tanpa Scan QR:
            1. Buka aplikasi di HP cewekmu.
            2. Klik **"Tautkan dengan nomor telepon"** & masukkan nomor WA kamu.
            3. Muncul kode 8 digit $\rightarrow$ buka WA utama $\rightarrow$ Perangkat Tertaut $\rightarrow$ Masukkan kode tersebut.
            4. Selesai!
          files: |
            release-apks/MyBoy.apk
            release-apks/MyGirl.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
